name: Candidate packages
on:
  push:
    branches: [main, 'release/**', 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    name: Package install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build, inspect and install candidate packages
        shell: pwsh
        run: |
          $frameworks = if ($IsWindows) { @('net8.0','net9.0','net10.0','net462','net472') } else { @('net8.0','net9.0','net10.0') }
          # GDI and WPF package consumers run on Windows only.
          $windowsFrameworks = if ($IsWindows) { @('net8.0-windows','net472') } else { @() }
          ./eng/Test-Packages.ps1 -OutputDirectory "$env:RUNNER_TEMP/freepdf-packages" -Frameworks $frameworks -WindowsFrameworks $windowsFrameworks
          [xml]$props = Get-Content src/FreePDF.Version.props
          if (!$props.Project.PropertyGroup.FreePDFVersionLabel) {
            $receipt = Get-Content "$env:RUNNER_TEMP/freepdf-packages/validation.json" -Raw | ConvertFrom-Json
            ./eng/Test-ReleaseArtifact.ps1 -PackageDirectory "$env:RUNNER_TEMP/freepdf-packages" -ExpectedRevision $env:GITHUB_SHA -Version $receipt.version -RequiredFrameworks $frameworks -RequiredWindowsFrameworks $windowsFrameworks
            ./eng/Test-ReleaseArtifact.Tests.ps1 -PackageDirectory "$env:RUNNER_TEMP/freepdf-packages" -ExpectedRevision $env:GITHUB_SHA -Version $receipt.version -RequiredFrameworks $frameworks -RequiredWindowsFrameworks $windowsFrameworks
          }
      - name: Audit public APIs against pinned MIT packages
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/Test-PublicApi.ps1 -PackageDirectory "$env:RUNNER_TEMP/freepdf-packages" -OutputDirectory "$env:RUNNER_TEMP/freepdf-api"
      - name: Install independent Linux validators
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y qpdf poppler-utils default-jre-headless
      - name: Install verified veraPDF
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/Install-VeraPdf.ps1 -OutputDirectory "$env:RUNNER_TEMP/verapdf"
      - name: Independently validate installed-package output
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/Test-PdfOutput.ps1 -PackageDirectory "$env:RUNNER_TEMP/freepdf-packages" -OutputDirectory "$env:RUNNER_TEMP/freepdf-independent" -VeraPdf "$env:RUNNER_TEMP/verapdf/cli/verapdf"
      - name: Rehearse plain 7.0.0 packages in a separate cache
        shell: pwsh
        run: |
          $frameworks = if ($IsWindows) { @('net10.0','net472') } else { @('net10.0') }
          $windowsFrameworks = if ($IsWindows) { @('net472') } else { @() }
          ./eng/Test-Packages.ps1 -OutputDirectory "$env:RUNNER_TEMP/freepdf-stable-rehearsal" -Frameworks $frameworks -WindowsFrameworks $windowsFrameworks -StableRehearsal
      - name: Independently validate the stable rehearsal
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/Test-PdfOutput.ps1 -PackageDirectory "$env:RUNNER_TEMP/freepdf-stable-rehearsal" -OutputDirectory "$env:RUNNER_TEMP/freepdf-stable-independent" -VeraPdf "$env:RUNNER_TEMP/verapdf/cli/verapdf"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-packages-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/freepdf-packages/*.nupkg
            ${{ runner.temp }}/freepdf-packages/validation.json
            ${{ runner.temp }}/freepdf-packages/library-advisories*.json
            ${{ runner.temp }}/freepdf-packages/library-dependencies/**
            ${{ runner.temp }}/freepdf-packages/consumer-*/**
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stable-rehearsal-unpublished-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/freepdf-stable-rehearsal/*.nupkg
            ${{ runner.temp }}/freepdf-stable-rehearsal/*.json
            ${{ runner.temp }}/freepdf-stable-rehearsal/library-dependencies/**
            ${{ runner.temp }}/freepdf-stable-rehearsal/consumer-*/**
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && runner.os == 'Linux'
        with:
          name: independent-release-checks
          path: |
            ${{ runner.temp }}/freepdf-api/*.json
            ${{ runner.temp }}/freepdf-api/*.log
            ${{ runner.temp }}/freepdf-independent/**
            ${{ runner.temp }}/freepdf-stable-independent/**
          retention-days: 14
          if-no-files-found: warn

  # The packages have no net11.0 assets; .NET 11 apps use the net10.0 ones. This job installs the exact candidate
  # packages (the Linux artifact, which publishing uploads) in .NET 11 consumers, built with the .NET 11 SDK only.
  # The packages themselves stay built by the job above.
  dotnet11:
    name: Package install on .NET 11 / ${{ matrix.os }}
    needs: packages
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '11.0.x'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-packages-ubuntu-24.04
          path: ${{ runner.temp }}/candidate
      - name: Install the candidate packages in .NET 11 consumers
        shell: pwsh
        run: |
          $windowsFrameworks = if ($IsWindows) { @('net11.0-windows') } else { @() }
          ./eng/Test-Packages.ps1 -OutputDirectory "$env:RUNNER_TEMP/freepdf-dotnet11" -PackageDirectory "$env:RUNNER_TEMP/candidate" -Frameworks @('net11.0') -WindowsFrameworks $windowsFrameworks
