name: Comparison lab
on:
  push:
    branches: [main, 'release/**', 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comparison-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    name: Pixels / ${{ matrix.os }} / ${{ matrix.framework }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            framework: net10.0
          - os: windows-2022
            framework: net10.0
          - os: windows-2022
            framework: net462
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      # The Ubuntu mirror on hosted runners can deliver under 100 KB/s, which let this job hit its time limit.
      # The downloaded packages are kept in the Actions cache, so the mirror only serves package lists.
      # The key uses the image date: GitHub runs several builds of one image (in Azure and AWS) at once.
      # A new image date starts from the previous cache; apt downloads only packages whose version changed.
      # veraPDF uses the Java that the runner images already include.
      - name: Identify the Linux runner image
        if: runner.os == 'Linux'
        id: image
        run: |
          prefix="linux-renderer-debs-$ImageOS-mupdf-tools-qpdf-poppler-utils-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix${ImageVersion%%.*}" >> "$GITHUB_OUTPUT"
      - name: Restore Linux renderer packages
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.image.outputs.key }}
          restore-keys: ${{ steps.image.outputs.prefix }}
      - name: Install Linux renderer
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update -qq
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true mupdf-tools qpdf poppler-utils
          # The cache is saved by the runner user after the job.
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          echo "Cached packages: $(ls ~/apt-archives/*.deb | wc -l)"
      - name: Install pinned Windows renderer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'mupdf.zip'
          Invoke-WebRequest 'https://github.com/ArtifexSoftware/mupdf-downloads/releases/download/1.28.5/mupdf-1.28.5-windows.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '13476a53e84f5527983158acb6442c7853b3cdc022f3b24880780dcfba1fcc99') { throw 'Renderer hash mismatch.' }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'renderer')
          ./lab/scripts/Install-RendererRuntime.ps1 -RendererDirectory (Join-Path $env:RUNNER_TEMP 'renderer/mupdf-1.28.5-windows')
      - name: Generate and compare fixture PDFs
        shell: pwsh
        run: |
          $renderer = if ($IsWindows) { Join-Path $env:RUNNER_TEMP 'renderer/mupdf-1.28.5-windows/mutool.exe' } else { (Get-Command mutool).Source }
          ./lab/scripts/Test-Lab.ps1 -Framework '${{ matrix.framework }}' -Renderer $renderer -DataDirectory "$env:RUNNER_TEMP/freepdf-lab-runs"
      - name: Check lab output with independent PDF tools
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          ./eng/Install-VeraPdf.ps1 -OutputDirectory "$env:RUNNER_TEMP/verapdf"
          ./eng/Test-PdfOutput.ps1 -LabDirectory "$env:RUNNER_TEMP/freepdf-lab-runs" -OutputDirectory "$env:RUNNER_TEMP/freepdf-lab-runs/independent" -VeraPdf "$env:RUNNER_TEMP/verapdf/cli/verapdf"
      # Artifact storage is shared by every io7 repository. Branch and PR results are kept 3 days, main's 14.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: comparisons-${{ matrix.os }}-${{ matrix.framework }}
          path: ${{ runner.temp }}/freepdf-lab-runs
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 3 }}
          if-no-files-found: warn
      # The Windows lab bundle is about 136 MB and is only installed by hand on the lab host.
      # Build it for pushes to main and for manual runs, not for every branch push and PR.
      - name: Prepare Windows deployment bundle
        if: runner.os == 'Windows' && matrix.framework == 'net10.0' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        shell: pwsh
        run: ./lab/scripts/Publish-Lab.ps1 -OutputDirectory "$env:RUNNER_TEMP/freepdf-lab-windows"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Windows' && matrix.framework == 'net10.0' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        with:
          name: freepdf-lab-windows
          path: ${{ runner.temp }}/freepdf-lab-windows
          retention-days: 3
