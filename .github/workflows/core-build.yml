name: Core build

on:
  push:
    branches: ['release/**', 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Core / ${{ matrix.framework }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0, netstandard2.0]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Build PDF and document layout libraries
        run: >-
          dotnet build src/foundation/src/MigraDoc/src/MigraDoc.Rendering/MigraDoc.Rendering.csproj
          --configuration Release
          -p:TargetFrameworks=${{ matrix.framework }}
          -p:TargetFramework=${{ matrix.framework }}
      - name: Build RTF document renderer
        run: >-
          dotnet build src/foundation/src/MigraDoc/src/MigraDoc.RtfRendering/MigraDoc.RtfRendering.csproj
          --configuration Release
          -p:TargetFrameworks=${{ matrix.framework }}
          -p:TargetFramework=${{ matrix.framework }}
